name: Build RAHAMAN KHATA APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la
          find . -maxdepth 3 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \)
      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper properties found, but gradlew is missing."
            exit 1
          else
            echo "Gradle wrapper is missing from the project root."
            exit 1
          fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RAHAMAN-KHATA-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
